project:
  name: "Identifying High-Impact Bicycle Network Improvements"
  course: "COMPSCI 683"

reproducibility:
  random_seed: 683

study_area:
  name: "Greater Boston"
  region: "greater_boston"
  municipalities:
    - Boston
    - Cambridge
    - Somerville
    - Brookline

network:
  source: "OpenStreetMap"
  graph_type: "directed_multigraph"
  lts_source: "StressMap-derived LTS"
  edge_length_field: "length"
  edge_cost_field: "cost"
  simplified_lts_field: "max_lts"

  cost_model:
    formula: "edge_length * rider_profile_lts_weight"

demand:
  source: "modeled origin-destination demand"
  scenario_id: 1
  fixed_baseline_sample: true

  total_modeled_trips: 50000

  categories:
    school: 20000
    office: 20000
    healthcare: 3000
    transit: 2000
    greenspace: 2000
    store: 3000

rider_profiles:

  child:
    scenario_id: 1
    description: "Child / highly stress-sensitive baseline"
    lts_weights:
      1: 1.0
      2: 1.5
      3: 3.0
      4: 6.0

  low_confidence_adult:
    scenario_id: 6
    description: "Low-confidence adult baseline"
    lts_weights:
      1: 1.0
      2: 1.6
      3: 3.0
      4: 6.0

  typical_adult:
    scenario_id: 11
    description: "Typical adult baseline"
    lts_weights:
      1: 1.0
      2: 1.3
      3: 2.2
      4: 4.0

  experienced_adult:
    scenario_id: 16
    description: "Experienced / traffic-tolerant adult baseline"
    lts_weights:
      1: 1.0
      2: 1.1
      3: 1.5
      4: 2.75

routing:
  algorithms:
    - ucs
    - astar

  baseline_algorithm: "ucs"

  preserve_per_od_results: true

  per_od_output_fields:
    - origin_node
    - destination_node
    - destination_category
    - demand
    - rider_profile
    - route_cost
    - route_distance
    - route_edge_count

  benchmark_metrics:
    - runtime_seconds
    - nodes_expanded
    - route_cost
    - route_distance

candidate_generation:
  maximum_candidates: 20
  eligible_lts:
    - 3
    - 4
  connectivity_reserve: 5
  require_homogeneous_high_stress_segment: true
  selection_strategy: "benefit screening with low-stress connectivity reserve"

  evidence:
    - modeled_demand
    - high_lts_usage
    - potential_stress_benefit
    - low_stress_network_connectivity

  required_output_fields:
    - candidate_id
    - location
    - length_m
    - current_lts
    - modeled_demand
    - preliminary_benefit
    - selection_reason

intervention_evaluation:
  maximum_full_simulations: 10

  # Simulated improvements lower eligible candidate segments to LTS 2.
  target_lts: 2

  reroute_after_intervention: true

  primary_metric:
    name: "demand_weighted_route_cost_reduction"
    higher_is_better: true

  secondary_metrics:
    - od_pairs_improved
    - mean_route_cost_reduction
    - physical_distance_change
    - benefit_by_destination_category
    - benefit_by_rider_profile

optimization:
  method: "greedy"
  objective: "maximize_demand_weighted_route_cost_reduction"

  # No monetary project-cost model is available, so optimization uses
  # a transparent project-count constraint rather than treating length
  # as a proxy for construction cost.
  constraint_type: "maximum_project_count"
  maximum_projects: 5

  candidate_pool: "top_10_full_simulations"
  marginal_evaluation: "full_rerouting_after_each_candidate_addition"
  profile_aggregation: "mean_across_four_rider_profiles"

  report_cumulative_length: true

  tie_breakers:
    - "higher_mean_improved_demand"
    - "shorter_cumulative_length_m"

robustness:
  alternative_rider_weights: true

  alternative_profile_scenarios:
    child: 5
    low_confidence_adult: 10
    typical_adult: 15
    experienced_adult: 20

  second_fixed_od_sample: true
  baseline_od_sample: "fixed_baseline"
  baseline_od_seed_known: false
  second_od_seed: 684

  evaluate_ranking_stability: true

  stability_metrics:
    - spearman_rank_correlation
    - top_5_overlap
    - optimized_package_overlap

outputs:
  baseline_directory: "results/baseline"
  routing_directory: "results/routing"
  candidate_directory: "results/candidates"
  intervention_directory: "results/interventions"
  optimization_directory: "results/optimization"
  robustness_directory: "results/robustness"
  figure_directory: "reports/figures"
