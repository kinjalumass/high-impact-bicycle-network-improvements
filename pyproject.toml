[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "high-impact-bicycle-network-improvements"
version = "1.0"
description = "COMPSCI 683 project evaluating high-impact bicycle network improvements using stress-aware routing and demand-weighted intervention analysis."
readme = "README.md"

requires-python = ">=3.12"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.5.0",
    # Keep pandas <=2.3.3 because later versions change behavior used by the pipeline
    "pandas<=2.3.3",
    "geopandas>=1.1.3",
    "osmnx>=2.1.0",
    "shapely>=2.1.2",
    "scipy>=1.18.0",
    "statsmodels",
    "networkx>=3.6.1",
    "pyproj>=3.7.2",
    "scikit-learn>=1.9.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "matplotlib>=3.11.0",
    "folium>=0.20.0",
    "branca",
    "pyarrow",
    "streamlit>=1.30.0",
    "pydeck>=0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

dev = [
    "ruff",
    "jupyter",
    "seaborn",
    "sphinx",
]
[tool.ruff]
line-length = 119
