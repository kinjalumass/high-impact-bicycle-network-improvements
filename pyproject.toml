# A build system is required to convert your code into a distributable package.
# setuptools is the oldest and most common build tool, but we also like Poetry
[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bcu-graph-analysis"
version = "1.0"
description = "Analysis of bicycle connectivity and Level of Traffic Stress (LTS) for the Greater Boston area, built by the DS4CG Boston Cyclists Union Team."
readme = "README.md"

# What version of python does your library work with?
# numpy 2.5 requires >=3.12; environment.yml used 3.12
requires-python = ">=3.12"

# Metadata about your package in case you upload it to PYPI
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# All the dependencies needed for running your module go here.
dependencies = [
    "numpy>=2.5.0",
    # Upper bound: newer pandas changed behavior the pipeline relies on
    "pandas<=2.3.3",
    "geopandas>=1.1.3",
    "osmnx>=2.1.0",
    "shapely>=2.1.2",
    "scipy>=1.18.0",
    "statsmodels",
    "networkx>=3.6.1",
    "pyproj>=3.7.2",
    "scikit-learn>=1.9.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "matplotlib>=3.11.0",
    "folium>=0.20.0",
    "branca",
    "pyarrow",
    "streamlit>=1.30.0",  # Added for the corridor dashboard
    "pydeck>=0.8.0",      # Added for 3D map rendering and HTML exports
]

[project.optional-dependencies]
# Extra dependencies only needed for running tests go here
test = [
    "pytest",
]

# Dependencies that are useful only to developers, like an autoformatter and
# support for visualizations in jupyter notebooks go here
dev = [
    "ruff",
    "jupyter",
    "seaborn",
    "sphinx",
]
# Add customizations to the Ruff linter as described on https://docs.astral.sh/ruff/configuration/
[tool.ruff]
# Override ruff's default so that lines aren't more than 120 characters
line-length = 119
